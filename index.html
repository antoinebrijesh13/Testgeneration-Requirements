<title>TestGeneration Pipeline Requirements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --fg: #000000;
  --mid: #444444;
  --faint: #8A8A8A;
  --rule: #E2E2E2;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 34px 24px 72px; }

h1 { font-size: clamp(23px, 2.8vw, 29px); font-weight: 600; letter-spacing: -.015em; line-height: 1.15; margin: 0; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 38px; margin: 14px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--fg); }
.chip {
  font-family: var(--sans); font-size: 13px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 0; padding: 8px 14px; cursor: pointer;
}
.chip:hover { border-color: var(--fg); }
.chip[hidden] { display: none; }
.readout { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--faint); text-align: right; }
.readout b { color: var(--fg); font-weight: 500; }

.board { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; margin-top: 22px; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.col-head h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin: 0; }
.col-head span { font-family: var(--mono); font-size: 11px; color: var(--faint); }

.phase { margin-bottom: 22px; }
.phase-head { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; }
.phase-name { font-size: 11px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--faint); }
.phase-rule { flex: 1; height: 1px; background: var(--rule); }
.stack { display: flex; flex-direction: column; gap: 0; }

.card {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--bg); border: 0; border-top: 1px solid var(--rule);
  padding: 12px 2px 13px;
}
.stack .card:last-child { border-bottom: 1px solid var(--rule); }
.card:hover .rid { text-decoration: underline; text-underline-offset: 3px; }
.card:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
.card-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.rid { font-family: var(--mono); font-size: 12.5px; font-weight: 500; }
.kids { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: auto; }
.statement { font-size: 14px; line-height: 1.45; margin: 0; }
.parent-tag { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--rule); word-break: break-word; }

.card.chosen { padding-left: 12px; box-shadow: inset 3px 0 0 var(--fg); }
.card.chosen .statement { font-weight: 500; }
.card.hidden { display: none; }

.detail { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--rule); display: grid; gap: 7px; }
.detail-row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; }
.detail-row dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 2px; }
.detail-row dd { margin: 0; font-size: 13.5px; color: var(--mid); line-height: 1.45; }
.detail-row dd.src { font-family: var(--mono); font-size: 12px; word-break: break-word; }

@media (max-width: 880px) {
  .board { grid-template-columns: 1fr; gap: 24px; }
  .readout { margin-left: 0; width: 100%; text-align: left; }
}
</style>

<div class="wrap">
  <h1>TestGeneration Pipeline Requirements</h1>

  <div class="controls">
    <button class="chip" id="clear" hidden>Clear</button>
    <p class="readout" id="readout">13 system · 37 module</p>
  </div>

  <div class="board">
    <section>
      <div class="col-head"><h2>System requirements</h2></div>
      <div id="sysCol"></div>
    </section>
    <section>
      <div class="col-head"><h2>Module requirements</h2></div>
      <div id="modCol"></div>
    </section>
  </div>
</div>

<script>
const PHASES = [
  ["Set up",   ["SYS-01","SYS-02","SYS-03"]],
  ["Generate", ["SYS-04","SYS-05"]],
  ["Check",    ["SYS-06","SYS-07","SYS-08","SYS-09"]],
  ["Loop",     ["SYS-10","SYS-11"]],
  ["Record",   ["SYS-12","SYS-13"]]
];

const SYS = {
  "SYS-01": { s: "The pipeline shall identify the buggy version, the fixed version, the test that already shows the bug, and the environment both versions run in.",
    why: "Everything after this depends on the right two versions and a working environment.",
    check: "All four are named and exist before anything is generated.",
    src: "bug_context.py: resolve_bug_context / resolve_env_python" },
  "SYS-02": { s: "The pipeline shall stop with a stated reason if any of those four is missing or unusable.",
    why: "Fail at set-up, not halfway through validation.",
    check: "Remove the environment; the run stops at set-up with a clear message.",
    src: "bug_context.py: resolve_bug_context" },
  "SYS-03": { s: "The pipeline shall run the test that shows the bug and record what failed and where.",
    why: "Every later stage is built from this recorded failure.",
    check: "The record names the file, line, exception and the method that broke.",
    src: "step1_bug_analysis.py: build_step1_output" },
  "SYS-04": { s: "The pipeline shall generate each test from the recorded facts for that bug.",
    why: "Stop the model inventing tests that never touch the fault.",
    check: "The generation input contains those facts and they belong to the same bug.",
    src: "benchmark_test_info.py · call_chain_info.py · generation_guidance.py" },
  "SYS-05": { s: "The pipeline shall generate two kinds of tests: tests that catch the bug, and tests that check working behaviour.",
    why: "A patch can under-fix or over-fix; each kind catches one of those.",
    check: "Run one bug; both kinds are present, or the reason one is missing is recorded.",
    src: "negative_test_generation.py / positive_test_generation.py" },
  "SYS-06": { s: "The pipeline shall run each test on both the buggy code and the fixed code.",
    why: "The difference between the two runs is the whole oracle.",
    check: "Every accepted test has two saved results, one per version.",
    src: "validate_tests.py: validate_negative / validate_positive" },
  "SYS-07": { s: "The pipeline shall stop any test that runs longer than its time limit.",
    why: "Bound a stuck test instead of blocking the run.",
    check: "A hanging test is cut off at the limit and marked a timeout, not a failure.",
    src: "validate_tests.py: timed_run — VALIDATE_TEST_TIMEOUT, default 120s" },
  "SYS-08": { s: "The pipeline shall check that the test actually ran the broken part of the code.",
    why: "Reject tests that pass or fail for unrelated reasons.",
    check: "Every accepted test records which evidence satisfied the check.",
    src: "validate_tests.py — exact line, method range or traceback text" },
  "SYS-09": { s: "The pipeline shall accept or reject each test using a written rule for its kind.",
    why: "Acceptance must be repeatable by a second person.",
    check: "One known good and one known bad test per kind; the decision matches the rule.",
    src: "validate_tests.py · iterative_generation.py: AcceptanceCriteria" },
  "SYS-10": { s: "The pipeline shall feed the reason for rejection into the next try.",
    why: "Let execution results correct the next candidate.",
    check: "The next prompt contains the previous rejection and its output.",
    src: "iterative_generation.py: generate_one / FailureRecord.for_prompt" },
  "SYS-11": { s: "The pipeline shall stop after a set number of tries per bug.",
    why: "Make run effort predictable before the run starts.",
    check: "Set the limit to two on a bug that accepts nothing; exactly two tries happen.",
    src: "iterative_generation.py: iterate — target 5, 15 attempts, streak limit 3" },
  "SYS-12": { s: "The pipeline shall record what happened on every try.",
    why: "Explain both complete and partial runs.",
    check: "The saved outcomes add up to the number of tries.",
    src: "iterative_generation.py: AttemptRecord / persist_outputs" },
  "SYS-13": { s: "The pipeline shall save, with each accepted test, the settings and evidence used to make it.",
    why: "A result that cannot be traced cannot be defended.",
    check: "From the saved files alone, identify the code version, settings and run.",
    src: "iterative_generation.py: persist_outputs" }
};

const GROUPS = [
  ["Context", [
    ["CTX-01", "SYS-01", "The context module shall resolve the bug to its buggy and fixed checkout folders.", "bug_context.py: resolve_bug_context"],
    ["CTX-02", "SYS-01", "The context module shall resolve the interpreter that runs that project.", "bug_context.py: resolve_env_python"],
    ["CTX-03", "SYS-02", "The context module shall raise a clear error when a checkout or interpreter is missing.", "bug_context.py: resolve_bug_context"]
  ]],
  ["Failure evidence", [
    ["EVD-01", "SYS-03", "The analysis module shall record whether the failing test passed or failed.", "step1_bug_analysis.py: build_step1_output — benchmark return code"],
    ["EVD-02", "SYS-03", "The analysis module shall record the file and line where the failure happened.", "step1_bug_analysis.py: build_step1_output — fault file and line"],
    ["EVD-03", "SYS-03", "The analysis module shall record the exception type and message.", "step1_bug_analysis.py: build_step1_output — fault.error_type"],
    ["EVD-04", "SYS-03", "The analysis module shall record the method that broke.", "step1_bug_analysis.py: build_step1_output — focal method"]
  ]],
  ["Test context", [
    ["BEN-01", "SYS-04", "The extraction module shall save the failing test's own source code.", "benchmark_test_info.py: run_benchmark_test_info"],
    ["BEN-02", "SYS-04", "The extraction module shall save the imports and helper functions that test needs.", "benchmark_test_info.py: run_benchmark_test_info"],
    ["BEN-03", "SYS-04", "The call-chain module shall save the chain of calls from the test to the broken method.", "call_chain_info.py — TEST_GEN.process_call_chain"]
  ]],
  ["Guidance", [
    ["GDE-01", "SYS-04", "The guidance module shall turn the recorded facts into a written description of what breaks and why.", "generation_guidance.py: GUIDANCE_SCHEMA_BLOCK"],
    ["GDE-02", "SYS-04", "The guidance module shall reject guidance that is missing any required field.", "generation_guidance.py: validate_guidance_schema"],
    ["GDE-03", "SYS-05", "The guidance module shall give separate advice for bug-catching tests and behaviour tests.", "generation_guidance.py: positive_axes / negative_axes"]
  ]],
  ["Generation", [
    ["GEN-01", "SYS-04", "The generation module shall put the recorded facts and the guidance into the prompt for every test.", "positive_test_generation.py / negative_test_generation.py"],
    ["GEN-02", "SYS-05", "The generation module shall produce a test name, test code and a reason for each candidate.", "positive_ / negative_test_generation.py: validate_*_test_object"],
    ["GEN-03", "SYS-05", "The generation module shall reject a candidate with an empty name, code or reason.", "positive_ / negative_test_generation.py: validate_*_test_object"],
    ["GEN-04", "SYS-05", "The generation module shall use a separate path for bug-catching tests and behaviour tests.", "negative_test_generation.py / positive_test_generation.py"]
  ]],
  ["Running", [
    ["RUN-01", "SYS-06", "The validation module shall run each candidate on the buggy checkout and save the result.", "validate_tests.py: run_pytest_with_coverage"],
    ["RUN-02", "SYS-06", "The validation module shall run each candidate on the fixed checkout and save the result.", "validate_tests.py: run_pytest_with_coverage"],
    ["RUN-03", "SYS-07", "The validation module shall kill a test that passes its time limit and mark it a timeout.", "validate_tests.py: timed_run — VALIDATE_TEST_TIMEOUT, default 120s"]
  ]],
  ["Relevance", [
    ["REL-01", "SYS-08", "The validation module shall collect coverage while the test runs.", "validate_tests.py: run_pytest_with_coverage"],
    ["REL-02", "SYS-08", "The validation module shall check whether the broken line or the broken method was reached.", "validate_tests.py: validate_negative / validate_positive"],
    ["REL-03", "SYS-08", "The validation module shall record which evidence was used: exact line, method, or traceback text.", "validate_tests.py: output_mentions_fault_line"]
  ]],
  ["Acceptance", [
    ["ACC-01", "SYS-09", "A bug-catching test shall be accepted only if it fails on the buggy code and passes on the fixed code.", "validate_tests.py: validate_negative"],
    ["ACC-02", "SYS-09", "A bug-catching test shall be accepted only if its failure matches the recorded failure.", "validate_tests.py: benchmark_error_signature / _msgs_match"],
    ["ACC-03", "SYS-09", "A behaviour test shall be accepted only if it passes on both versions.", "validate_tests.py: validate_positive"],
    ["ACC-04", "SYS-09", "A test shall be accepted only if it also passed the relevance check.", "iterative_generation.py: AcceptanceCriteria"],
    ["ACC-05", "SYS-09", "The validation module shall record the reason for every rejection.", "iterative_generation.py: FailureRecord"]
  ]],
  ["Loop", [
    ["LOP-01", "SYS-10", "The controller shall put the last rejections, with their code and output, into the next prompt.", "iterative_generation.py: generate_one / FailureRecord.for_prompt"],
    ["LOP-02", "SYS-11", "The controller shall stop when the wanted number of accepted tests is reached.", "iterative_generation.py: iterate — target_count, default 5"],
    ["LOP-03", "SYS-11", "The controller shall stop when the try limit is reached.", "iterative_generation.py: iterate — max_attempts, default 15"],
    ["LOP-04", "SYS-11", "The controller shall stop when the same rejection reason repeats too many times.", "iterative_generation.py: iterate — streak_limit, default 3"]
  ]],
  ["Records", [
    ["OUT-01", "SYS-12", "The reporting module shall save one record per try, with what happened.", "iterative_generation.py: AttemptRecord"],
    ["OUT-02", "SYS-12", "The reporting module shall save how long generation and validation took.", "iterative_generation.py: AttemptRecord — durations"],
    ["OUT-03", "SYS-12", "The reporting module shall save why the run stopped.", "iterative_generation.py: persist_outputs — stop_reason"],
    ["OUT-04", "SYS-13", "The reporting module shall save each accepted test as a file next to its validation result.", "iterative_generation.py: persist_outputs"],
    ["OUT-05", "SYS-13", "The reporting module shall save the model, settings and bug the test came from.", "iterative_generation.py: persist_outputs"]
  ]]
];

const MODS = GROUPS.flatMap(([g, rows]) => rows.map(([id, parent, s, src]) => ({ id, parent, s, src, group: g })));
const childrenOf = id => MODS.filter(m => m.parent === id);
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.getElementById("sysCol").innerHTML = PHASES.map(([name, ids]) => `
  <div class="phase">
    <div class="phase-head"><span class="phase-name">${name}</span><span class="phase-rule"></span></div>
    <div class="stack">${ids.map(id => {
      const r = SYS[id], k = childrenOf(id).length;
      return `<button class="card" data-side="sys" data-id="${id}" aria-pressed="false">
        <span class="card-top"><span class="rid">${id}</span><span class="kids">${k} module${k === 1 ? "" : "s"}</span></span>
        <p class="statement">${esc(r.s)}</p>
        <dl class="detail" hidden>
          <div class="detail-row"><dt>Why</dt><dd>${esc(r.why)}</dd></div>
          <div class="detail-row"><dt>Check</dt><dd>${esc(r.check)}</dd></div>
        </dl>
      </button>`;
    }).join("")}</div>
  </div>`).join("");

document.getElementById("modCol").innerHTML = GROUPS.map(([g, rows]) => `
  <div class="phase">
    <div class="phase-head"><span class="phase-name">${g}</span><span class="phase-rule"></span></div>
    <div class="stack">${rows.map(([id, parent, s, src]) => `
      <button class="card" data-side="mod" data-id="${id}" data-parent="${parent}" aria-pressed="false">
        <span class="card-top"><span class="rid">${id}</span><span class="kids">→ ${parent}</span></span>
        <p class="statement">${esc(s)}</p>
        <p class="parent-tag" hidden>${esc(src)}</p>
      </button>`).join("")}</div>
  </div>`).join("");

const cards = [...document.querySelectorAll(".card")];
const readout = document.getElementById("readout");
const clearBtn = document.getElementById("clear");
let selected = null;

function apply() {
  // The focus of a selection is always one system requirement: either the one
  // clicked, or the parent of the module clicked. Both columns narrow to it.
  const focus = selected ? (selected.side === "sys" ? selected.id : selected.parent) : null;

  cards.forEach(c => {
    const isSys = c.dataset.side === "sys";
    let hide = false;

    let chosen = false;
    if (focus) {
      chosen = c.dataset.id === selected.id;
      hide = isSys ? c.dataset.id !== focus : c.dataset.parent !== focus;
    }
    c.classList.toggle("hidden", hide);
    c.classList.toggle("chosen", chosen && !hide);
    c.setAttribute("aria-pressed", String(chosen));

    const detail = c.querySelector(".detail");
    if (detail) detail.hidden = !chosen;
    const srcLine = c.querySelector(".parent-tag");
    if (srcLine) srcLine.hidden = !chosen;
  });

  document.querySelectorAll(".phase").forEach(p => {
    const any = [...p.querySelectorAll(".card")].some(c => !c.classList.contains("hidden"));
    p.style.display = any ? "" : "none";
  });

  clearBtn.hidden = !selected;

  if (focus) {
    const k = childrenOf(focus).length;
    readout.innerHTML = `<b>${focus}</b> is met by ${k} module requirement${k === 1 ? "" : "s"}`;
  } else {
    readout.textContent = "13 system · 37 module";
  }
}

const board = document.querySelector(".board");
const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

cards.forEach(c => c.addEventListener("click", () => {
  const id = c.dataset.id;
  selected = (selected && selected.id === id) ? null : { id, side: c.dataset.side, parent: c.dataset.parent };
  apply();
  // Both columns just collapsed to a handful of rows at the top of the board,
  // so bring the board into view rather than leaving the reader scrolled past it.
  board.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}));

clearBtn.addEventListener("click", () => { selected = null; apply(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { selected = null; apply(); } });

apply();
</script>
